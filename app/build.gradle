plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.topsky.laserremove'
    compileSdk 36

    defaultConfig {
        applicationId "com.topsky.laserremove"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 仅保留 arm64-v8a 架构
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file('ti.jks')
            storePassword "topsky"
            keyAlias "topsky"
            keyPassword "topsky"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false //启用混淆
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false //启用混淆
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview

    // Jetpack Lifecycle - ViewModel & LiveData
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.runtime

    // 权限请求框架：https://github.com/getActivity/XXPermissions
    implementation 'com.github.getActivity:XXPermissions:26.5'
    implementation 'com.blankj:utilcodex:1.31.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'

    // 网络请求框架：https://github.com/getActivity/EasyHttp
    implementation 'com.github.getActivity:EasyHttp:13.5'
    // OkHttp 框架：https://github.com/square/okhttp
    // noinspection GradleDependency
    implementation 'com.squareup.okhttp3:okhttp:5.3.0'
    // Gson 解析容错：https://github.com/getActivity/GsonFactory
    implementation ('com.github.getActivity:GsonFactory:10.5') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-reflect'
    }
    // Json 解析框架：https://github.com/google/gson
    implementation ('com.google.code.gson:gson:2.13.2')

}